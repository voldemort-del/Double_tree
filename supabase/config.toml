# Supabase CLI configuration
# https://supabase.com/docs/guides/local-development/cli/config

project_id = "demo-prototype"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
enable_signup = true
enable_anonymous_sign_ins = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]

[functions.concierge-ai]
verify_jwt = true
